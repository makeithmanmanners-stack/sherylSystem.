services:
  - type: web
    name: sheryl-system
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn store_erp.wsgi:application"
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sheryl-system-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: "4"

databases:
  - name: sheryl-system-db
    plan: free
    databaseName: sarisari_erp
    user: sheryl_user
